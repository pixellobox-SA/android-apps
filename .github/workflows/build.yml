name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 17 SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: hub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
